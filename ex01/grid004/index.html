<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <style>
        div.container{
            border: 1px solid rgb(4, 4, 16);
            display: grid;
            grid-template-rows: repeat(3,100px);
            grid-template-columns: repeat(4,1fr);
        }
        div.item{
            border: 1px solid rgb(235, 46, 21);
            padding: 5px;
        }
        .caixa1{
           grid-row-start: 1;
           grid-row-end: 2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="caixa1">A</div>
        <div class="caixa2">B</div>
        <div class="caixa3">C</div>
    </div>
</body>
</html>
